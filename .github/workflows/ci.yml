name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test test/source-boundary.test.mjs
      - run: node scripts/compat-table.mjs --check
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run
      - run: npm run build:lib
      - run: node scripts/verify-release.mjs
